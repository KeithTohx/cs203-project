# runs on every pr into main, branch protection makes a failure block the merge
name: ci

on:
  # branches filters the TARGET branch not the source, so this means prs aimed at main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # pinned, not ubuntu-latest: that moves to ubuntu 26 on 19 oct and we do not
    # want the runner changing under us mid sprint. revisit after the demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # drive sync keeps dropping the exec bit on mvnw
      - run: chmod +x mvnw

      - run: ./mvnw -B verify
