# on merge to main, ssh into the vm, rebuild and restart
# tests already ran on the pr so we skip them here
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# two merges landing together should queue, not race
concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/tripsense
            # force server to match main
            git fetch --prune origin
            git reset --hard origin/main
            ./mvnw -B -q package -DskipTests
            sudo systemctl restart tripsense
            # poll rather than a fixed wait, startup has already grown 9s -> 14s
            for i in $(seq 1 12); do
              sleep 5
              if curl -fsS -o /dev/null http://localhost/v3/api-docs; then exit 0; fi
            done
            echo "app did not come back up"
            journalctl -u tripsense -n 30 --no-pager
            exit 1
