# on merge to main, ssh into the vm, rebuild and restart
# tests already ran on the pr so we skip them here
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# two merges landing together should queue, not race
concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/tripsense
            # force server to match main
            git fetch --prune origin
            git reset --hard origin/main
            ./mvnw -B -q package -DskipTests
            sudo systemctl restart tripsense
            # poll rather than a fixed wait, startup has already grown 9s -> 14s
            for i in $(seq 1 36); do
              sleep 5
              if curl --connect-timeout 2 --max-time 5 -fsS \
                -o /dev/null http://127.0.0.1:80/v3/api-docs; then
                echo "TripSense is ready"
                exit 0
              fi
            done

            echo "App did not become ready"
            systemctl status tripsense --no-pager --full || true
            ss -ltn | grep -E ':(80|8080)[[:space:]]' || true
            journalctl -u tripsense -n 200 --no-pager || true
            exit 1
