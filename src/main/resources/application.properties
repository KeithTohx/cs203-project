# ---------------------------------------------------------------------------
# CS203 G3T2 - TripSense
# ---------------------------------------------------------------------------

# Logging: keep the framework quiet so our own DEBUG lines are readable
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.csd.tripsense=DEBUG

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# PORT lets the deployed server pick the port, defaults to 8080 locally
server.port=${PORT:8080}

# without this swagger never sends the X-XSRF-TOKEN header, so every POST, PUT and
# PATCH tried from the ui comes back 403 even when you are logged in
springdoc.swagger-ui.csrf.enabled=true

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# SQLite keeps the whole database in one file, data/tripsense.db, so there is
# no server to install and the file can be inspected with any SQLite tool.
# The driver creates the file, but NOT the data/ folder - that folder is kept
# in the repository by data/.gitkeep so a fresh clone works straight away.
# DB_PATH overrides the location on the deployed server
spring.datasource.url=jdbc:sqlite:${DB_PATH:data/tripsense.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate's SQLite support lives in the community dialects module.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# "update" creates missing tables and columns and leaves existing data alone,
# so rows survive a restart. It cannot change or drop an existing column, and
# SQLite's ALTER TABLE is limited - if a schema change does not take effect,
# delete data/tripsense.db and restart. See README.md.
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------------------
# Error responses
# ---------------------------------------------------------------------------
# Show the exception message and any validation errors so a caller knows what
# went wrong, but never the stack trace. Set explicitly because devtools turns
# stack traces on in development and is not in the deployed jar, so without
# these the errors would look different once deployed.
# Note these are spring.web.error and not server.error, which Spring Boot 4
# renamed. The old names are ignored without warning.
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=always

# Close the JPA session when the controller returns, not when the response is
# rendered. Keeps lazy-loading mistakes visible at development time instead of
# silently issuing extra queries later.
spring.jpa.open-in-view=false

# for testing seed data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# naming this overrides the default, so data.sql has to be listed or it stops loading.
# countries.sql and options.sql are generated by the scripts in tools/, optional: so the
# app still starts before anyone has run them
spring.sql.init.data-locations=classpath:data.sql,optional:classpath:countries.sql,optional:classpath:options.sql

# ---------------------------------------------------------------------------
# AI model (used from Phase 4)
# ---------------------------------------------------------------------------
# Which model answers. Both starters are on the classpath, so this picks one:
#   openai -> Groq, the hosted model we normally run
#   ollama -> the local model, for working offline or when the Groq quota runs out
# Switching is an environment variable, no rebuild.
spring.ai.model.chat=${CHAT_PROVIDER:openai}

# Groq speaks the OpenAI api, so the OpenAI client points at their base url instead.
# A 1.5b local model could not follow the rubric; this is the fix for that.
spring.ai.openai.api-key=${GROQ_KEY:missing-key}
spring.ai.openai.base-url=${CHAT_BASE_URL:https://api.groq.com/openai/v1}
spring.ai.openai.chat.options.model=${CHAT_MODEL:openai/gpt-oss-120b}
# Low temperature: we want a consistent yes/no answer, not a creative one.
spring.ai.openai.chat.options.temperature=0.2
# gpt-oss thinks before it answers and those reasoning tokens count against the budget.
# a real rubric call spends about 300 on reasoning alone, and if the ceiling cuts it off the
# reply comes back empty and the json cannot be parsed, so leave plenty of room
spring.ai.openai.chat.options.max-tokens=1200

# The local fallback. num-ctx is Ollama-only, which is why it is not set above.
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=8192

# A free tier answers 429 when we go too fast, and that has to be waited out rather than
# treated as an outage. on-client-errors must be true or 429 is skipped as a 4xx and the
# job aborts after three in a row.
spring.ai.retry.max-attempts=4
spring.ai.retry.backoff.initial-interval=5s
spring.ai.retry.backoff.max-interval=60s
spring.ai.retry.on-http-codes=429
spring.ai.retry.on-client-errors=true

# Our own brake, applied before the request goes out. The real limit on groq's free plan is
# 8000 tokens a minute, not the request count, and one rubric call costs about 850 of them.
# 1000 requests a day is the other ceiling. 0 turns the brake off.
chat.rate-limit.per-minute=${CHAT_RATE_LIMIT:8}

# For chatbot to retain memory for context
# Creates a new table in the database to store the conversations
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# GDELT news ingestion
gdelt.ingest.enabled=${GDELT_ENABLED:true}
# every 30 min rather than 10: a hosted free tier is metered per day, not per cycle
gdelt.ingest.interval-ms=${GDELT_INTERVAL_MS:7200000}
gdelt.ingest.initial-delay-ms=20000
gdelt.lastupdate-url=https://data.gdeltproject.org/gdeltv2/lastupdate.txt
gdelt.country-codes=AF,AL,AG,AQ,AN,AO,AV,AY,AC,AR,AM,AA,AS,AU,AJ,BF,BA,BG,BB,BO,BE,BH,BN,BD,BT,BL,BK,BC,BR,BX,BU,UV,BM,BY,CB,CM,CA,CV,CJ,CT,CD,CI,CH,CO,CN,CG,CF,CW,CS,IV,HR,CU,CY,EZ,DA,DJ,DO,DR,EC,EG,ES,EK,ER,EN,ET,FJ,FI,FR,FG,FP,GB,GA,GG,GM,GH,GI,GR,GL,GJ,GP,GQ,GT,GV,PU,GY,HA,HO,HK,HU,IC,IN,ID,IR,IZ,EI,IS,IT,JM,JA,JO,KZ,KE,KR,KN,KS,KV,KU,KG,LA,LG,LE,LT,LI,LY,LS,LH,LU,MC,MK,MA,MI,MY,MV,ML,MT,RM,MB,MR,MP,MX,FM,MD,MN,MG,MJ,MH,MO,MZ,WA,NR,NP,NL,NC,NZ,NU,NG,NI,NO,MU,PK,PS,PM,PP,PA,PE,RP,PL,PO,RQ,QA,RE,RO,RS,RW,WS,SM,TP,SA,SG,RI,SE,SL,SN,LO,SI,BP,SO,SF,OD,SP,CE,SU,NS,WZ,SW,SZ,SY,TW,TI,TZ,TH,TO,TN,TD,TS,TU,TX,TV,UG,UP,AE,UK,US,UY,UZ,NH,VE,VM,WF,GZ,YM,ZA,ZI
gdelt.min-location-mentions=3
gdelt.title-keywords=
# gdelt already tags every article with themes and we were throwing them away. these go into the
# description as a Topics line, so the model sees a topic beside the headline instead of nothing.
# this does not filter anything: the keyword gate only runs when title-keywords is set
gdelt.theme-prefixes=NATURAL_DISASTER,MANMADE_DISASTER,TERROR,PROTEST,ARMEDCONFLICT,EPIDEMIC,TAX_DISEASE,CRISISLEX,TRANSPORT
gdelt.ai.enabled=true
gdelt.ai.max-per-run=${GDELT_AI_MAX:80}
# How many articles go to the AI in one request (1 = one request per article, the old behaviour).
# Bigger batches are cheaper now: a hosted model has far more context than the 8192 we had locally
gdelt.ai.batch-size=40

# Impact evaluation (runs after each fully ingested GDELT file)
impact.eval.enabled=${IMPACT_EVAL_ENABLED:true}
impact.eval.news-lookback-days=3
# Upper bound on AI calls per run; whatever is left is picked up after the next file.
# 1000 calls a day over 48 half-hourly runs is about 20 each, and user actions need some of
# those, so the job takes 8 and leaves the rest
impact.eval.max-per-run=${IMPACT_EVAL_MAX:5}


# Impact evaluation of a newly created itinerary against news already stored
impact.eval.new-itinerary.enabled=true
# How far back to look: news published in the last N days (UTC)
impact.eval.new-itinerary.news-lookback-days=5
# Upper bound on AI calls for one new itinerary
impact.eval.new-itinerary.max-calls=20